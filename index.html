<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adventures of ROK</title>
  <link rel="icon" href="assets/ui/icone.svg" />
</head>
<body>
  <div id="frame">
    <div id="viewport"></div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ripple" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="7">
        <animate attributeName="baseFrequency" dur="6s" values="0.012 0.06;0.014 0.07;0.012 0.06" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="10" />
    </filter>
  </svg>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
