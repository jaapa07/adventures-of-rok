<!--
  Sumaúma Entalhada — fonte autoral de Adventures of ROK.
  Cada glifo é a LINHA CENTRAL do entalhe (traço do formão). A espessura, o volume de madeira,
  o contorno, a sombra e o brilho são aplicados em camadas pelo componente de texto (src/ui/components/carved.ts).
  Métrica: topo das maiúsculas y=30, linha de base y=120, acentos entre y=-16 e y=6.
  data-w = largura do desenho (de x=0 até x=data-w). O avanço é data-w + 30.
  Os traços têm pequenas irregularidades de propósito: é letra cortada a mão em tábua.
  Os glifos acentuados (Á À Ã Â É Ê Í Ó Ô Õ Ú Ç) são montados pelo tools/build-ui.ts a partir da base + acento.
-->
